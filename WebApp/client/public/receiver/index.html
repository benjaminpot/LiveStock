<!DOCTYPE HTML>
<html lang="zh-Hant">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="css/style.css" />
  <title>LiveStock 監視器</title>
</head>

<body>

  <div id="container">
    <h1>LiveStock 監視器</h1>

    <div id="warning" hidden="true"></div>

    <div class="cctv-screens">
    <div class="cctv-screen">
      <div id="player"></div>
      <div id="cctvBlackout" role="status" hidden></div>
      <span data-crosshair aria-label="準星" hidden>＋</span>
    </div>
    <div id="secondaryScreen" class="cctv-screen" hidden>
      <video id="secondaryVideo" playsinline muted></video>
      <div id="secondaryBlackout" class="cctv-blackout" role="status" hidden></div>
      <span data-crosshair aria-label="準星" hidden>＋</span>
    </div>
    </div>

    <section id="cctvPanel" aria-label="監視器控制">
      <p data-connection role="status">尚未連線</p>
      <p>目前鏡頭：<strong data-current>—</strong>　切換冷卻：<span data-cooldown>—</span></p>
      <button type="button" data-next disabled>下一台監視器</button>
      <label data-slot-control hidden>選台目標
        <select data-slot aria-label="選台目標">
          <option value="0">主畫面</option>
          <option value="1">第二畫面</option>
        </select>
      </label>
      <p data-secondary-current hidden></p>
      <div data-monitors></div>
      <button type="button" id="fireButton" disabled title="請先在監視器影片內點一下放置準星">發射</button>
      <p id="fireResult" role="status">請點選影片放置準星</p>
      <p>操作方式：連線成功後，先點監視器影片內的羊放置「＋」準星；發射鍵亮起後再按發射。命中羊會造成擊殺，約 3 秒後重生。</p>
    </section>

    <div class="box">
      <span>Codec preferences:</span>
      <select id="codecPreferences" autocomplete="off" disabled>
        <option selected value="">Default</option>
      </select>
    </div>

    <div class="box">
      <span>Lock Cursor to Player:</span>
      <input type="checkbox" id="lockMouseCheck" autocomplete="off" />
    </div>

    <p>
      For more information about sample, see
        <a href="https://docs.unity3d.com/Packages/com.unity.renderstreaming@3.1/manual/sample-broadcast.html">Broadcast sample</a> document page.
    </p>

    <div id="message"></div>

    <section>
      <a href="https://github.com/Unity-Technologies/UnityRenderStreaming/tree/develop/WebApp/client/public/receiver"
        title="View source for this page on GitHub" id="viewSource">View source on GitHub</a>
    </section>
  </div>

  <script type="text/javascript" src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="https://unpkg.com/event-target@latest/min.js"></script>
  <script src="https://unpkg.com/resize-observer-polyfill@1.5.0/dist/ResizeObserver.global.js"></script>
  <script type="module" src="js/main.js"></script>

</body>

</html>
